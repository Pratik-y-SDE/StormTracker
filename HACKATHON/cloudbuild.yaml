steps:
  # 1. Build Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cyclone-impact-forecaster:$COMMIT_SHA', '.']

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cyclone-impact-forecaster:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cyclone-forecaster'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cyclone-impact-forecaster:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/cyclone-impact-forecaster:$COMMIT_SHA'
